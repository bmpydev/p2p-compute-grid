<!DOCTYPE html>
<html>
<head>
    <title>P2P Compute Node</title>
    <style>
        body { background: #222; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .node-box { background: #333; padding: 25px; border-radius: 12px; border: 1px solid #444; width: 400px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #4CAF50; font-size: 1.4em; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9em; }
        #p2pStatus { font-weight: bold; }
        .slider-container { margin-top: 20px; padding-top: 20px; border-top: 1px solid #444; }
        input[type=range] { width: 100%; cursor: pointer; }
        #perfInfo { color: #888; font-size: 0.8em; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="node-box">
        <h2 id="nodeTitle">Initializing WASM...</h2>

        <div id="perfInfo">Determining Hardware Profile...</div>

        <div class="stat-row">
            <span>State:</span>
            <span id="p2pStatus" style="color: #FF9800;">Waiting for Connection...</span>
        </div>
        <div class="stat-row">
            <span>CPU Cores:</span>
            <span id="cpuCores">?</span>
        </div>
        <div class="stat-row">
            <span>Performance Score:</span>
            <span id="perfScore">? Pts.</span>
        </div>

        <div class="slider-container">
            <label>Active Compute Threads: <b id="threadVal">1</b></label>
            <input type="range" id="threadSlider" min="1" max="1" value="1">
            <p style="font-size: 0.7em; color: #777; margin-top: 10px;">
                Increase threads to contribute more CPU cores to the cluster.
            </p>
        </div>
    </div>

    <script type="module">
        import init, { run_benchmark } from '/pkg/rust_worker.js';

        let subWorkers = [];
        const peers = {}; // requester_id: {pc, dc, headerQueue}
        let globalWS = null;

        async function run() {
            // WASM & Benchmark
            await init();
            const cores = navigator.hardwareConcurrency || 4;
            const t0 = performance.now();
            run_benchmark();
            const score = Math.round(1000 / (performance.now() - t0));

            // UI Update
            document.getElementById("nodeTitle").innerText = "Compute Node UP";
            document.getElementById("perfInfo").innerText = "Hardware profile established.";
            document.getElementById("cpuCores").innerText = cores;
            document.getElementById("perfScore").innerText = score + " Pts.";

            // Thread Slider Setup
            const slider = document.getElementById("threadSlider");
            slider.max = cores;
            slider.oninput = () => {
                document.getElementById("threadVal").innerText = slider.value;
                setupThreads(parseInt(slider.value));
            };
            setupThreads(1);

            // Signaling Connection (WebSocket) - only once
            globalWS = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + window.location.host + "/ws/worker");

            globalWS.onopen = () => {
                console.log("Signaling online. Syncing performance metrics...");
                // Token nur nötig, wenn der Server GRID_WORKER_TOKEN gesetzt hat
                const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
                globalWS.send(JSON.stringify({type: "auth", token}));
                // Score to index.html
                globalWS.send(JSON.stringify({type: "report_score", score: score}));
            };

            globalWS.onclose = (e) => {
                document.getElementById("p2pStatus").innerText =
                    e.code === 1008 ? "ACCESS DENIED (worker token)" : "OFFLINE";
            };

            globalWS.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                const rid = msg.requester_id;

                if (msg.type === "offer") {
                    // Eine Peer-Verbindung pro Requester; erneutes Offer ersetzt nur die eigene
                    closePeer(rid);
                    document.getElementById("p2pStatus").innerText = "Connect P2P...";
                    const pc = new RTCPeerConnection({
                        iceServers: [
                            { urls: "stun:stun.l.google.com:19302" },
                            { urls: "stun:stun1.l.google.com:19302" }
                        ]
                    });
                    const peer = { pc, dc: null, headerQueue: [] };
                    peers[rid] = peer;

                    pc.onicecandidate = (e) => {
                        if (e.candidate) globalWS.send(JSON.stringify({type: "ice", requester_id: rid, candidate: e.candidate}));
                    };

                    pc.ondatachannel = (event) => {
                        const dataChannel = event.channel;
                        dataChannel.binaryType = "arraybuffer";
                        peer.dc = dataChannel;

                        dataChannel.onopen = () => {
                            updateP2PStatus();
                            // Info to Requester (for List)
                            dataChannel.send(JSON.stringify({
                                type: "WORKER_INFO",
                                score: score,
                                cores: parseInt(slider.value)
                            }));
                        };
                        dataChannel.onclose = updateP2PStatus;

                        dataChannel.onmessage = (e) => {
                            if (typeof e.data === "string") {
                                const msg = JSON.parse(e.data);

                                if (msg.type === "PING") {
                                    dataChannel.send(JSON.stringify({ type: "PONG", time: msg.time }));
                                    return;
                                }

                                peer.headerQueue.push(msg);
                            } else {
                                const header = peer.headerQueue.shift();
                                if (header) {
                                    dispatch(header, e.data, rid);
                                }
                            }
                        };
                    };

                    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    globalWS.send(JSON.stringify({type: "answer", requester_id: rid, sdp: answer}));
                }
                else if (msg.type === "ice" && peers[rid]) {
                    await peers[rid].pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                }
                else if (msg.type === "requester_left") {
                    closePeer(rid);
                }
            };
        }

        function closePeer(rid) {
            if (!peers[rid]) return;
            peers[rid].pc.close();
            delete peers[rid];
            updateP2PStatus();
        }

        function openChannels() {
            return Object.values(peers).filter(p => p.dc && p.dc.readyState === "open").map(p => p.dc);
        }

        function updateP2PStatus() {
            const n = openChannels().length;
            const el = document.getElementById("p2pStatus");
            el.innerText = n ? `READY (${n} requester${n > 1 ? "s" : ""})` : "Waiting for Connection...";
            el.style.color = n ? "#4CAF50" : "#FF9800";
        }

        function setupThreads(count) {
            // Stop old Sub-Worker
            subWorkers.forEach(w => w.terminate());
            subWorkers = [];

            for(let i = 0; i < count; i++) {
                const w = new Worker('/compute_node.js', { type: 'module' });
                w.onmessage = (e) => {
                    // Result from Sub-Worker -> back to the requester that sent the task
                    const { _rid, ...metadata } = e.data.metadata;
                    const dataChannel = peers[_rid]?.dc;
                    if (dataChannel && dataChannel.readyState === "open") {
                        dataChannel.send(JSON.stringify(metadata));
                        dataChannel.send(e.data.pixels);
                    }
                };
                subWorkers.push(w);
            }

            // Scaling capacity
            openChannels().forEach(dc => dc.send(JSON.stringify({type: "WORKER_INFO", cores: count})));
        }

        function dispatch(header, pixels, rid) {
            // Dispatch task to a random available sub-worker
            const worker = subWorkers[Math.floor(Math.random() * subWorkers.length)];
            worker.postMessage({ header: { ...header, _rid: rid }, pixels }, [pixels]);
        }

        run().catch(err => console.error("Worker Boot Error:", err));
    </script>
</body>
</html>
