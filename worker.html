<!DOCTYPE html>
<html>
<head>
    <title>P2P Compute Node</title>
    <style>
        body { background: #222; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .node-box { background: #333; padding: 25px; border-radius: 12px; border: 1px solid #444; width: 400px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #4CAF50; font-size: 1.4em; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9em; }
        #p2pStatus { font-weight: bold; }
        .slider-container { margin-top: 20px; padding-top: 20px; border-top: 1px solid #444; }
        input[type=range] { width: 100%; cursor: pointer; }
        #perfInfo { color: #888; font-size: 0.8em; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="node-box">
        <h2 id="nodeTitle">Initializing WASM...</h2>

        <div id="perfInfo">Determining Hardware Profile...</div>

        <div class="stat-row">
            <span>State:</span>
            <span id="p2pStatus" style="color: #FF9800;">Waiting for Connection...</span>
        </div>
        <div class="stat-row">
            <span>CPU Cores:</span>
            <span id="cpuCores">?</span>
        </div>
        <div class="stat-row">
            <span>Performance Score:</span>
            <span id="perfScore">? Pts.</span>
        </div>

        <div class="slider-container">
            <label>Active Compute Threads: <b id="threadVal">1</b></label>
            <input type="range" id="threadSlider" min="1" max="1" value="1">
            <p style="font-size: 0.7em; color: #777; margin-top: 10px;">
                Increase threads to contribute more CPU cores to the cluster.
            </p>
        </div>
    </div>

    <script type="module" src="/worker.js"></script>
</body>
</html>
